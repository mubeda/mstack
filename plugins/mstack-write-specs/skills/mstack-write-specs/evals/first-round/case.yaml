schema_version: "1.1"
name: first-round
expected_outcome: |
  The run reads the shop code, restates the goal, and sends a first interview message with numbered questions,
  each with a recommended answer. It does not ask what the code already answers (for example the 30-minute session
  timeout or that email goes through the SMTP mailer), writes no spec file yet, and changes no code.
