schema_version: "1.1"
name: first-message
expected_outcome: |
  The run restates the goal and, before writing anything, asks in one message where the plan should go and whether
  there are external information sources to include. It asks no reviewer model in the first message, says the
  reviewers are chosen at the plan review, never asks whether the plan should be reviewed, and writes no plan files
  and changes no code.
