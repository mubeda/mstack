schema_version: "1.1"
name: expensive-answers
expected_outcome: |
  The user named most capable for phase 1 and its tasks and said no, in advance, to phase 2 and its tasks. The
  written plan records most capable for phase 1 and its tasks as the user's choice with no question about them, and
  standard for phase 2 and its tasks with the declined tier nowhere for them.
context:
  scaffold_script: place-files.sh
notes: |
  The run loads the branch copies of mstack-plan and of its five shared skills. It has no subagent tool, and its
  `PATH` holds no real `codex`, `claude` or `agy`, so no client starts.
  The prompt stops the run after the plan files are written, so no check and no review runs.
