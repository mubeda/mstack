schema_version: "1.1"
name: two-failed-rounds
expected_outcome: |
  Two stand-in rounds that both fail the same check. The run stops the phase: no third request, no commit, the round-two
  files stay in the working tree, nothing is stashed, and the last reply offers the other model, a re-scope, or stopping.
context:
  scaffold_script: place-files.sh
  working_folder: mathlib
needs:
  skills: [mstack-claude-pm-codex-dev, mstack-find-skills, mstack-best-model-for, mstack-receive-review]
  plugin_dir: evals/_fixture/fake-developer
  env:
    CLAUDE_PLUGIN_DATA: <case data folder>
    FAKE_DEV_SCRIPT: <this case folder>/rounds.json
    CODEX_COMPANION_SCRIPT: <skill folder>/evals/_fixture/fake-developer/scripts/codex-companion.mjs
  tools: [a logged-in codex CLI on PATH (the preflight and the Codex review are real)]
