schema_version: "1.1"
name: failing-review
expected_outcome: |
  Two stand-in rounds. Round one's mul fails the stated check for a negative factor while its report claims all green; the
  coordinator's own run shows the failure, nothing is committed, and a findings brief goes out with --resume at high. Round
  two fixes it. Validation writes test-summary.txt, which is reviewed as a difference after validation. One commit holds
  exactly the accepted tree.
context:
  scaffold_script: place-files.sh
  working_folder: mathlib
needs:
  skills: [mstack-claude-pm-codex-dev, mstack-find-skills, mstack-best-model-for, mstack-receive-review]
  plugin_dir: evals/_fixture/fake-developer
  env:
    CLAUDE_PLUGIN_DATA: <case data folder>
    FAKE_DEV_SCRIPT: <this case folder>/rounds.json
    CODEX_COMPANION_SCRIPT: <skill folder>/evals/_fixture/fake-developer/scripts/codex-companion.mjs
  tools: [a logged-in codex CLI on PATH (the preflight and the Codex review are real)]
