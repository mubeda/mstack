schema_version: "1.1"
name: antigravity-complete-machine
expected_outcome: |
  One turn. Every Antigravity row is installed and ui-ux-pro-max is absent. The report says the setup is complete,
  shows ui-ux-pro-max once as not available in Antigravity, proposes no command and calls.log holds no install call.
context:
  scaffold_script: place-files.sh
notes: |
  The prompt names Antigravity as the host, so in Claude Code or Codex this case is a fixture: it shows that the
  text is followed, not what an Antigravity session does. Every command goes through `./testenv` to stand-ins
  (`agy`, `codegraph`, `npm`, `npx`, `gh`, `python3`) that log each call to `calls.log` and write only under the
  run folder's `home/`. The run's own `PATH` holds no real `agy`, `codegraph`, `npm` or `npx` either.
  One turn, no question. It is in the Antigravity self-test batch.
