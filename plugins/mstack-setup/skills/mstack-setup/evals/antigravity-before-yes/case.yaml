schema_version: "1.1"
name: antigravity-before-yes
expected_outcome: |
  One turn. The code index is installed but not connected, and ponytail and the 26 mstack skills are missing. The
  status says so and shows ui-ux-pro-max as not available in Antigravity. The list holds the connect command, one
  plugin install for ponytail and one per missing mstack plugin, names mcp_config.json, and ends with one question.
  Nothing is installed or connected.
context:
  scaffold_script: place-files.sh
notes: |
  The prompt names Antigravity as the host, so in Claude Code or Codex this case is a fixture: it shows that the
  text is followed, not what an Antigravity session does. Every command goes through `./testenv` to stand-ins
  (`agy`, `codegraph`, `npm`, `npx`, `gh`, `python3`) that log each call to `calls.log` and write only under the
  run folder's `home/`. The run's own `PATH` holds no real `agy`, `codegraph`, `npm` or `npx` either.
  One turn in Claude Code. In the Antigravity self-test the case is listed with `reply-1.md` and `questions` 1:
  its first line is the question it answers, and its answer makes the session record its question and stop before
  any install, because a prepared answer is not the user's yes to an install.
